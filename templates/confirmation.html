<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SyllyScheduler — Confirm Events</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <style>
        .editor-container {
            width: min(860px, 100%);
            background: var(--card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }
        .editor-header h2 { color: var(--navy); font-family: 'Playfair Display', serif; }
        .btn-add {
            background: var(--surface); color: var(--accent);
            border: 1px dashed var(--accent); padding: 8px 16px;
            border-radius: var(--radius-sm); font-size: 16px;
        }
        .btn-add:hover { background: rgba(46,107,229,0.1); }

        .events-list { display: flex; flex-direction: column; gap: 16px; }
        .event-card {
            background: #fff; border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 20px;
            position: relative; display: grid;
            grid-template-columns: 1fr 1fr; gap: 16px;
            box-shadow: var(--shadow-sm);
        }
        .full-width { grid-column: span 2; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 600; color: var(--navy-mid); text-transform: uppercase; }
        .form-group input {
            padding: 10px 14px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); font-family: inherit;
            font-size: 14px; color: var(--text); background: var(--surface);
        }
        .form-group input:focus { outline: none; border-color: var(--accent); }
        .btn-remove {
            position: absolute; top: -10px; right: -10px;
            background: var(--danger); color: white; border: none;
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(214,66,66,0.4);
        }
        .action-bar {
            display: flex; justify-content: center; gap: 16px; margin-top: 16px;
            border-top: 1px solid var(--border); padding-top: 24px;
        }
        .btn-confirm {
            background: linear-gradient(135deg, var(--success) 0%, #1A8C5B 100%);
            color: white; font-size: 15px; padding: 13px 32px;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 16px rgba(45,171,111,0.4);
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-confirm:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(45,171,111,0.5); }
        .btn-clipboard { background: var(--navy); color: white; font-size: 15px; }
        .btn-clipboard:hover { background: var(--navy-mid); transform: translateY(-2px); }

        .export-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
        .export-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; padding: 20px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); color: var(--navy);
            font-weight: 600; font-size: 14px; transition: all 0.2s; cursor: pointer;
        }
        .export-btn:hover {
            background: #fff; border-color: var(--accent);
            box-shadow: var(--shadow-md); transform: translateY(-2px);
        }
        .export-btn svg { width: 30px; height: 30px; }
        .export-btn.google:hover { color: #DB4437; border-color: #DB4437; }
        .export-btn.apple:hover  { color: #000; border-color: #000; }
        .export-btn.outlook:hover{ color: #0078D4; border-color: #0078D4; }
        .export-btn.file:hover   { color: var(--accent); border-color: var(--accent); }

        /* No-filesystem badge */
        .no-fs-note {
            display: flex; align-items: center; gap: 8px;
            background: rgba(45,171,111,0.08);
            border: 1px solid rgba(45,171,111,0.2);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 12.5px; color: #1A7A50;
            margin-top: 4px;
        }
        .no-fs-note svg { width: 14px; height: 14px; fill: var(--success); flex-shrink: 0; }

        #toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: var(--navy); color: #fff;
            padding: 12px 24px; border-radius: var(--radius-sm);
            font-size: 14px; box-shadow: var(--shadow-md);
            transition: transform 0.3s ease;
            z-index: 10000;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        #confirm-btn.loading { opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body>

<header>
    <a class="logo-wrap" href="/">
        <div class="logo-icon">
            <img src="{{ url_for('static', filename='syllschedlogo.png') }}"
                 alt="SyllyScheduler logo"
                 style="width:100%; height:100%; object-fit:cover; border-radius:inherit;" />
        </div>
        <div class="logo-text">
            <span class="logo-name">SyllyScheduler</span>
            <span class="logo-tagline">Syllabus &rarr; Calendar</span>
        </div>
    </a>
</header>

<main>
    <section class="editor-container">
        <div class="editor-header">
            <h2>Review Your Events</h2>
            <button id="add-event-btn" class="btn-add">+ Add Event</button>
        </div>

        <div id="events-list" class="events-list"></div>

        <div class="action-bar">
            <button id="copy-btn" class="btn-clipboard">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                </svg>
                Copy to Clipboard
            </button>

            <button id="confirm-btn" class="btn-confirm">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
                </svg>
                Export to Calendar
            </button>
        </div>
    </section>
</main>

<footer>
    &copy; 2026 SyllyScheduler. All rights reserved. &nbsp;|&nbsp;
    Built for CS&nbsp;Final Project &nbsp;|&nbsp;
    <a href="#" tabindex="-1">Privacy</a>
</footer>

<!-- Export/Calendar chooser modal -->
<div id="exportModal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
    <div class="modal-box" style="max-width:480px; width:92%;">
        <button id="closeExport" class="modal-close">&#10005; Close</button>
        <h3 id="exportTitle">Choose your Calendar App</h3>
        <p style="font-size:14px; color:var(--text-muted); margin-bottom:4px;">
            Select how you'd like to add these events. Your file is ready in-app — no manual file browsing needed.
        </p>
        <div class="export-options">
            <button class="export-btn google" onclick="triggerExport('google')">
                <svg viewBox="0 0 24 24" fill="#DB4437"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg>
                Google Calendar
            </button>
            <button class="export-btn apple" onclick="triggerExport('native')">
                <svg viewBox="0 0 24 24" fill="#000"><path d="M15.54 11.02c-.04-2.5 2.05-3.73 2.15-3.79-1.16-1.7-2.97-1.93-3.62-1.95-1.54-.15-3.02.9-3.8.9-.78 0-2-.88-3.26-.85-1.63.03-3.14.95-3.98 2.41-1.7 2.95-.44 7.33 1.22 9.72.81 1.18 1.77 2.49 3.03 2.44 1.22-.04 1.68-.78 3.16-.78 1.48 0 1.98.78 3.18.75 1.24-.03 2.07-1.2 2.87-2.37 1.03-1.52 1.46-2.99 1.48-3.07-.03-.01-2.36-.9-2.39-3.41zM11.96 4.79c.67-.81 1.12-1.94.99-3.07-1 .04-2.18.66-2.87 1.47-.6.71-1.13 1.87-.97 2.98 1.12.08 2.19-.57 2.85-1.38z"/></svg>
                Apple Calendar
            </button>
            <button class="export-btn outlook" onclick="triggerExport('native')">
                <svg viewBox="0 0 24 24" fill="#0078D4"><path d="M22 20V4H2v16h20zM6 16v-2h12v2H6zm0-4V8h12v4H6z"/></svg>
                Outlook
            </button>
            <button class="export-btn file" onclick="triggerExport('file')">
                <svg viewBox="0 0 24 24" fill="var(--accent)"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Save .ICS File
            </button>
        </div>
    </div>
</div>

<div id="toast">Copied to clipboard!</div>

<script>
    const eventsList = document.getElementById('events-list');
    let generatedBlobUrl = null;

    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('/raw_json');
            const result   = await response.json();
            if (result.raw) {
                const events = JSON.parse(result.raw);
                events.forEach(ev => addEventCard(ev));
            }
        } catch (err) {
            console.error('Failed to load events:', err);
        }
    });

    function addEventCard(data = { name:'', begin:'', end:'', description:'' }) {
        const card = document.createElement('div');
        card.className = 'event-card';
        card.innerHTML = `
            <button class="btn-remove" title="Remove Event">&#10005;</button>
            <div class="form-group full-width">
                <label>Name:</label>
                <input type="text" class="evt-name" value="${escHtml(data.name || '')}" placeholder="Event Title" />
            </div>
            <div class="form-group">
                <label>Begin:</label>
                <input type="text" class="evt-begin" value="${escHtml(data.begin || '')}" placeholder="YYYY-MM-DD HH:MM:SS" />
            </div>
            <div class="form-group">
                <label>End:</label>
                <input type="text" class="evt-end" value="${escHtml(data.end || '')}" placeholder="YYYY-MM-DD HH:MM:SS" />
            </div>
            <div class="form-group full-width">
                <label>Description:</label>
                <input type="text" class="evt-desc" value="${escHtml(data.description || '')}" placeholder="Short description" />
            </div>
        `;
        card.querySelector('.btn-remove').addEventListener('click', () => card.remove());
        eventsList.appendChild(card);
    }

    function escHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    document.getElementById('add-event-btn').addEventListener('click', () => addEventCard());

    function gatherEventsData() {
        return [...document.querySelectorAll('.event-card')].map(card => ({
            name:        card.querySelector('.evt-name').value,
            begin:       card.querySelector('.evt-begin').value,
            end:         card.querySelector('.evt-end').value,
            description: card.querySelector('.evt-desc').value
        }));
    }

    document.getElementById('copy-btn').addEventListener('click', () => {
        const events = gatherEventsData();
        let text = 'Academic Schedule:\n\n';
        events.forEach(e => {
            text += `Event: ${e.name}\nDate: ${e.begin} to ${e.end}\nDetails: ${e.description}\n\n`;
        });
        navigator.clipboard.writeText(text).then(() => showToast('Schedule copied! Paste it anywhere.'));
    });

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    document.getElementById('confirm-btn').addEventListener('click', async () => {
        const events = gatherEventsData();
        const btn = document.getElementById('confirm-btn');
        btn.classList.add('loading');
        btn.textContent = 'Generating…';

        try {
            const response = await fetch('/generate_ics', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ events })
            });

            if (response.ok) {
                const blob = await response.blob();
                if (generatedBlobUrl) URL.revokeObjectURL(generatedBlobUrl);
                generatedBlobUrl = URL.createObjectURL(blob);
                document.getElementById('exportModal').style.display = 'flex';
            } else {
                alert('Failed to generate calendar file.');
            }
        } catch (err) {
            console.error(err);
            alert('An error occurred.');
        } finally {
            btn.classList.remove('loading');
            btn.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
                </svg>
                Export to Calendar`;
        }
    });

    function triggerExport(type) {
        if (!generatedBlobUrl) return;

        // Trigger in-browser download — no user needs to navigate the file system
        const a = document.createElement('a');
        a.href     = generatedBlobUrl;
        a.download = 'SyllySchedule.ics';
        document.body.appendChild(a);
        a.click();
        a.remove();

        if (type === 'google') {
            setTimeout(() => {
                window.open('https://calendar.google.com/calendar/r/settings/export', '_blank');
                window.location.href = '/success';
            }, 600);
        } else {
            setTimeout(() => { window.location.href = '/success'; }, 600);
        }
    }

    document.getElementById('closeExport').addEventListener('click', () => {
        document.getElementById('exportModal').style.display = 'none';
    });
    document.getElementById('exportModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) e.currentTarget.style.display = 'none';
    });
</script>
</body>
</html>
